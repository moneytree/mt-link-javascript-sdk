version: 2.1

orbs:
  security-tools: moneytree/security-tools@2.0.4

references:
  no_master_filter: &filters_master_out
    filters:
      branches:
        ignore: master
  only_master_filter: &only_master_filter
    filters:
      branches:
        only: master
  only_release_tag_filter: &only_release_tag_filter
    filters:
      tags:
        # only on "x.y.z" pattern where x, y & z are numbers (e.g. 1.2.11)
        only: /^\d+\.\d+\.\d+$/

docker_defaults: &docker_defaults
  docker:
    - image: cimg/node:26.0
  working_directory: ~/mt-link-javascript-sdk

attach_workspace: &attach_workspace
  attach_workspace:
    at: ~/mt-link-javascript-sdk

install_corepack: &install_corepack
  run:
    name: Install Corepack
    command: npm install -g corepack@latest --force

jobs:
  start:
    <<: *docker_defaults
    steps:
      - run: echo 'start'

  dependencies:
    <<: *docker_defaults
    steps:
      - checkout
      - *attach_workspace
      - restore_cache:
          name: Restore node_modules cache
          key: dependency-cache-v2-{{ checksum "yarn.lock" }}
      - *install_corepack
      - run:
          name: Install Dependencies
          command: yarn install
      - save_cache:
          name: Save node_modules cache
          key: dependency-cache-v2-{{ checksum "yarn.lock" }}
          paths:
            - node_modules/
      - persist_to_workspace:
          root: ~/mt-link-javascript-sdk
          paths:
            - ./

  lint:
    <<: *docker_defaults
    steps:
      - *attach_workspace
      - *install_corepack
      - run:
          name: Linting
          command: yarn lint

  unit_test:
    <<: *docker_defaults
    steps:
      - *attach_workspace
      - *install_corepack
      - run:
          name: Running tests
          command: yarn test --maxWorkers 2

  typecheck:
    <<: *docker_defaults
    steps:
      - *attach_workspace
      - *install_corepack
      - run:
          name: Type checking
          command: yarn typecheck

  publish:
    <<: *docker_defaults
    steps:
      - checkout
      - run:
          name: Publish package to NPM
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            npm publish

  done:
    <<: *docker_defaults
    steps:
      - run:
          command: echo done

workflows:
  version: 2.1
  test_on_pr:
    jobs:
      - start:
          <<: *filters_master_out
      - security-tools/supply_chain_guard:
          context: new_github_mtservice_read
          requires:
            - start
      - security-tools/bearer:
          requires:
            - start
      - dependencies:
          requires:
            - security-tools/supply_chain_guard
      - lint:
          requires:
            - dependencies
      - unit_test:
          requires:
            - dependencies
      - typecheck:
          requires:
            - dependencies
      - done:
          requires:
            - lint
            - unit_test
            - typecheck

  publish_to_npm:
    jobs:
      - start:
          <<: [*only_master_filter, *only_release_tag_filter]
      - publish:
          requires:
            - start
      - done:
          requires:
            - publish
